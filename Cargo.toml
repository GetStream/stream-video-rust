[package]
name = "getstream"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
# Cargo then rejects a second crate that links libvpx: its bindings would use
# the struct layouts of another libvpx version with these symbols.
links = "vpx"
authors = ["Stream.io, Inc. <support@getstream.io>"]
license-file = "LICENSE"
description = "Official Rust SDK for Stream Video (server REST + SFU WebRTC)."
readme = "README.md"
repository = "https://github.com/GetStream/stream-video-rust"
homepage = "https://getstream.io/video/"
documentation = "https://docs.rs/getstream"
keywords = ["video", "webrtc", "sfu", "stream", "rtc"]
categories = ["api-bindings", "multimedia::video", "network-programming"]

# A published crate's own `.cargo/config.toml` is never read by Cargo (config is
# discovered from the *consumer's* directory tree), so it is deliberately absent
# from this list — see the note above `[dependencies]`.
include = [
    "/.env.example",
    "/build.rs",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/examples/**",
    "/LICENSE",
    "/native/**",
    "/proto/**",
    "/README.md",
    "/src/**",
]

[package.metadata.docs.rs]
# build.rs skips the codecs on docs.rs (`DOCS_RS`), but the crate supports
# only Linux and macOS. Restrict to the Linux gnu target. The crate has no
# Cargo features.
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

# WebRTC (SFU join/publish/subscribe/media) is the core purpose of this SDK, so
# the RTC stack is always compiled in — there is no `webrtc` Cargo feature. A
# plain `cargo build` resolves the full media stack (prost + WebSocket at
# runtime, protox + prost-build at build time) and runs proto codegen. protox is
# pure Rust, so no `protoc` is required. The published package carries prebuilt
# static libvpx and libopus in `native/<target>`; a git checkout builds them from
# pinned sources in build.rs.

[dependencies]
# Sinc resampler for PCM written at a rate other than 48 kHz. Only the `Async`
# resampler is used, so the default FFT feature is off.
rubato = { version = "5.0.1", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hmac = "0.13.0"
indexmap = "2.14.2"
prost = "0.14.4"
prost-types = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }
webrtc = "0.17.2"
flate2 = "1.1.9"

[dev-dependencies]
anyhow = "1.0.86"
criterion = "0.8.2"
dotenvy = "0.15.7"
hmac = "0.13.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

# Proto codegen (build.rs) always runs: protox parses the vendored `.proto`
# sources in pure Rust (no `protoc`) and prost-build emits the Rust types.
# Without prebuilt codec archives, build.rs downloads (ureq), checks (sha2),
# extracts (flate2, tar) and builds (cc gives the target toolchain) the sources.
[build-dependencies]
cc = "1.4.7"
flate2 = "1.1.9"
prost-build = "0.14.4"
protox = "0.9.1"
sha2 = "0.11.0"
tar = "0.4.46"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[profile.dev]
debug = "line-tables-only"
incremental = false

[[example]]
name = "join_call"

[[example]]
name = "gpt_realtime_bot"

[[bench]]
name = "media_baseline"
harness = false

[[bench]]
name = "timer_drift"
harness = false

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # The README is the crate-level doc (`#![doc = include_str!]`), so a broken
      # relative link there fails the docs.rs build. Catch it here instead.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Licenses are code-dependent: a dependency with an unreviewed license
      # should fail the PR that adds it. (Advisories are not — see
      # advisories.yml.)
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      - run: cargo test --locked --lib
      - run: cargo test --locked --doc
      # Compile the live suites and both examples. The live tests skip cleanly
      # without credentials (tests/common/mod.rs), so no secrets are needed here
      # — the Live workflow runs them for real.
      - run: cargo test --locked --no-run
      - run: cargo build --locked --examples

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.88.0"
      - run: cargo check --locked --all-targets

name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  codecs:
    uses: ./.github/workflows/codecs.yml

  publish:
    name: Publish to crates.io
    needs: codecs
    # Only a v* tag is a release. A manual run from a branch still builds the codecs above,
    # but publishes nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The crates.io Trusted Publishing token is minted in this job. The environment is where
    # its reviewers and allowed tags are enforced, and the trusted publisher on crates.io can
    # pin it, so a workflow on any other ref cannot mint a usable token.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the ancestry check below.
          fetch-depth: 0
      # Only publish a tag whose commit has already been merged to main. This catches a tag
      # pushed on the wrong commit. It cannot stop a deliberate one, because a tag push runs
      # the tagged commit's copy of this file; the tag ruleset and this environment's
      # reviewers do that.
      - name: Verify the tag is on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on ${DEFAULT_BRANCH}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on ${DEFAULT_BRANCH}."
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # Each artifact lands in `native/<target>`, where build.rs looks for it.
      - uses: actions/download-artifact@v4
        with:
          path: native
      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `native/` is ignored by git, so its files count as uncommitted changes.
      - name: Publish
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

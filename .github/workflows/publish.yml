name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  codecs:
    uses: ./.github/workflows/codecs.yml

  publish:
    name: Publish to crates.io
    needs: codecs
    # Only a v* tag is a release. If you start this workflow manually from a branch, it
    # builds the codecs but does not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This job gets the crates.io Trusted Publishing token. The crates-io environment has
    # the required reviewers and the tag rules. If you set this environment on the crates.io
    # trusted publisher, only a job in this environment can get a token.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The check in the next step needs the full git history.
          fetch-depth: 0
          # The ancestry check is local and cargo publish authenticates with the crates.io
          # token, so nothing here needs GITHUB_TOKEN in .git/config.
          persist-credentials: false
      # Publish only a tag that points at a commit on main. This step stops a tag on an
      # incorrect commit. It does not stop a tag on a commit that changes this file, because
      # a tag push uses the file from that commit. The tag ruleset and the reviewers of this
      # environment stop that tag.
      - name: Make sure that the tag is on main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at commit ${GITHUB_SHA}. This commit is not on ${DEFAULT_BRANCH}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on ${DEFAULT_BRANCH}."
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
      # Each artifact lands in `native/<target>`, where build.rs looks for it.
      - uses: actions/download-artifact@v4
        with:
          path: native
      - name: Verify tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # `native/` is ignored by git, so its files count as uncommitted changes.
      - name: Publish
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

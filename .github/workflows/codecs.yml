name: Codecs

# Builds the static libvpx and libopus for each target with build.rs (the git
# checkout path) and uploads `native/<target>` as an artifact named <target>.
# glibc builds use manylinux_2_28 (glibc 2.28), so the archives link on any
# glibc 2.28 or newer. The Publish workflow puts the artifacts in the package.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            image: alpine:3.22
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            image: alpine:3.22
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      # `docker run` instead of a job container: JavaScript actions cannot run
      # in an Alpine (musl) container.
      - name: Build in container
        if: matrix.image
        run: docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh .github/scripts/build-codecs.sh
      - name: Build
        if: '!matrix.image'
        run: cargo check --locked --lib
      - name: Collect
        run: |
          mkdir -p artifact
          cp target/debug/build/getstream-*/out/native/${{ matrix.target }}/* artifact/
          for f in artifact/*.a; do
            echo "${{ matrix.target }} $(basename "$f") raw=$(wc -c <"$f") gzip=$(gzip -9c "$f" | wc -c)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact

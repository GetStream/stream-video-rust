name: Set up Rust
description: Install the selected Rust toolchain and native codec dependencies

inputs:
  toolchain:
    description: Rust toolchain version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          build-essential clang cmake libvpx-dev pkg-config

    # `libvpx` is linked from the system (env-libvpx-sys + pkg-config); cmake and
    # a C compiler build the vendored libopus. The macOS images already ship
    # clang and pkg-config.
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: brew install libvpx cmake pkg-config

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        cache: false

    - name: Restore immutable Cargo inputs
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: cargo-inputs-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}

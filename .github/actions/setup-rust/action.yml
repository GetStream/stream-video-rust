name: Set up Rust
description: Install the selected Rust toolchain and the codec build tools

inputs:
  toolchain:
    description: Rust toolchain version
    required: true
  components:
    description: Comma-separated rustup components
    required: false
    default: ""

runs:
  using: composite
  steps:
    # A git checkout builds libvpx in build.rs, which needs nasm on x86_64. The
    # runner images already have a C compiler, make and perl.
    - name: Install nasm
      if: runner.os == 'Linux' && runner.arch == 'X64'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends nasm

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        cache: false

    - name: Restore immutable Cargo inputs
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/git/db
          ~/.cargo/registry/cache
          ~/.cargo/registry/index
        key: cargo-inputs-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}

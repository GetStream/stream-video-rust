[package]
name = "getstream-node-rtc"
version = "0.1.0-preview.2"
edition = "2024"
rust-version = "1.88"
authors = ["Stream.io, Inc. <support@getstream.io>"]
license-file = "../../LICENSE"
description = "Local Node.js bindings for the Stream Video Rust RTC stack."
repository = "https://github.com/GetStream/stream-video-rust"
homepage = "https://getstream.io/video/"
publish = false

[lib]
name = "stream_node_rtc"
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
getstream = { path = "../.." }
napi = { version = "3.12.2", default-features = false, features = ["async", "dyn-symbols", "napi8", "serde-json"] }
napi-derive = "3.6.3"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
webrtc = "0.17.2"

[build-dependencies]
napi-build = "2.4.1"
